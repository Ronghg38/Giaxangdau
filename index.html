<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Tùy Chỉnh Tỉ Lệ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        #wheel {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl p-6 text-center relative">
        <h1 class="text-2xl font-bold mb-4 text-yellow-400">Vòng Quay Phát Đạt</h1>

        <!-- Vòng quay -->
        <div class="flex justify-center my-6">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="wheel" class="w-full h-full rounded-full border-4 border-yellow-400 relative overflow-hidden flex items-center justify-center bg-gray-700">
                    <canvas id="wheelCanvas" width="320" height="320"></canvas>
                </div>
            </div>
        </div>

        <!-- Nút Quay cho người chơi -->
        <button id="spinBtn" onclick="spinWheel()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-600 hover:to-amber-700 text-gray-900 font-bold py-3 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
            QUAY NGAY
        </button>

        <div id="result" class="mt-4 text-lg font-semibold text-green-400 h-8"></div>

        <!-- Nút mở Admin Panel -->
        <div class="mt-8 border-t border-gray-700 pt-4 flex justify-between items-center">
            <span class="text-xs text-gray-400">Khu vực dành cho chủ sở hữu</span>
            <button onclick="openAdminModal()" class="bg-gray-700 hover:bg-gray-600 text-xs text-gray-300 py-1.5 px-3 rounded-lg border border-gray-600">
                ⚙️ Đăng nhập Admin
            </button>
        </div>
    </div>

    <!-- Modal Đăng nhập Admin -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl p-6 max-w-xs w-full border border-gray-700">
            <h3 class="text-lg font-bold mb-3 text-yellow-400">Mật khẩu Quản Trị</h3>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white mb-4 focus:outline-none focus:border-yellow-500">
            <div class="flex space-x-2">
                <button onclick="checkAdminPassword()" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded-lg">Xác nhận</button>
                <button onclick="closeModal('adminLoginModal')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 py-2 rounded-lg">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Modal Bảng Điều Khiển Admin (Tùy chỉnh phần thưởng & Tỉ lệ) -->
    <div id="adminPanelModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-xl p-6 max-w-lg w-full border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-yellow-400">Cài Đặt Vòng Quay & Tỉ Lệ</h3>
                <button onclick="closeModal('adminPanelModal')" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            
            <p class="text-xs text-gray-300 mb-3">Trọng số (Weight) càng cao thì xác suất trúng ô đó càng lớn. (Ví dụ: Trọng số 50 dễ trúng gấp đôi trọng số 25).</p>
            
            <div id="prizeInputs" class="space-y-3 mb-6">
                <!-- Danh sách sinh bằng JS -->
            </div>

            <div class="flex space-x-2 mb-4">
                <button onclick="addPrizeRow()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 rounded-lg">+ Thêm Ô</button>
            </div>

            <div class="flex space-x-2">
                <button onclick="savePrizes()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg">Lưu cấu hình</button>
                <button onclick="closeModal('adminPanelModal')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 py-2.5 rounded-lg">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        // Mật khẩu admin (Bạn có thể sửa lại tùy ý)
        const ADMIN_SECRET = "admin123456";

        // Danh sách phần thưởng kèm theo "weight" (Trọng số tỉ lệ trúng)
        let prizes = JSON.parse(localStorage.getItem('wheel_prizes_weighted')) || [
            { text: "Trúng Lớn", weight: 10, color: "#f59e0b" },
            { text: "Trượt rồi", weight: 50, color: "#374151" },
            { text: "Thêm Lượt", weight: 20, color: "#10b981" },
            { text: "Trượt nhẹ", weight: 40, color: "#ef4444" },
            { text: "Quà Nhỏ", weight: 30, color: "#3b82f6" }
        ];

        let startAngle = 0;
        let isSpinning = false;
        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");

        function drawWheel() {
            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, 320, 320);

            let currentAngle = 0;
            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color || getRandomColor(i);
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 150, currentAngle, currentAngle + arcSize);
                ctx.lineTo(160, 160);
                ctx.fill();
                ctx.save();

                // Vẽ chữ
                ctx.translate(160, 160);
                ctx.rotate(currentAngle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(prizes[i].text, 130, 5);
                ctx.restore();

                currentAngle += arcSize;
            }
        }

        function getRandomColor(index) {
            const colors = ["#f59e0b", "#3b82f6", "#10b981", "#8b5cf6", "#ef4444", "#ec4899", "#14b8a6", "#f97316"];
            return colors[index % colors.length];
        }

        // Thuật toán chọn phần thưởng dựa trên Trọng số (Tỉ lệ)
        function getWeightedRandomIndex() {
            let totalWeight = prizes.reduce((sum, p) => sum + Number(p.weight), 0);
            let randomNum = Math.random() * totalWeight;
            
            let currentSum = 0;
            for (let i = 0; i < prizes.length; i++) {
                currentSum += Number(prizes[i].weight);
                if (randomNum <= currentSum) {
                    return i;
                }
            }
            return 0;
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("result").innerText = "";
            document.getElementById("spinBtn").disabled = true;

            const numSegments = prizes.length;
            const winningIndex = getWeightedRandomIndex();

            // Tính toán góc quay để vòng quay dừng chính xác tại ô đã chọn theo trọng số
            const degreesPerSegment = 360 / numSegments;
            // Góc trung tâm của ô trúng tính từ đỉnh (0 độ)
            const targetAngleFromTop = 360 - (winningIndex * degreesPerSegment + degreesPerSegment / 2);
            
            // Thêm số vòng quay nguyên (ít nhất 5 vòng = 1800 độ) cộng với góc lệch cần đến
            const extraSpins = 360 * 5;
            const currentMod = startAngle % 360;
            let targetAdd = extraSpins + targetAngleFromTop - currentMod;
            if (targetAdd < extraSpins) targetAdd += 360;

            startAngle += targetAdd;

            const wheel = document.getElementById("wheel");
            wheel.style.transform = `rotate(${startAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;
                document.getElementById("result").innerText = `Kết quả: ${prizes[winningIndex].text}`;
            }, 4000);
        }

        // Admin functions
        function openAdminModal() {
            document.getElementById("adminLoginModal").classList.remove("hidden");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
        }

        function checkAdminPassword() {
            const pass = document.getElementById("adminPassword").value;
            if (pass === ADMIN_SECRET) {
                closeModal('adminLoginModal');
                document.getElementById("adminPassword").value = "";
                openAdminPanel();
            } else {
                alert("Mật khẩu không đúng!");
            }
        }

        function openAdminPanel() {
            renderPrizeInputs();
            document.getElementById("adminPanelModal").classList.remove("hidden");
        }

        function renderPrizeInputs() {
            const container = document.getElementById("prizeInputs");
            container.innerHTML = "";
            prizes.forEach((prize, index) => {
                container.innerHTML += `
                    <div class="flex space-x-2 items-center bg-gray-900 p-2 rounded-lg border border-gray-700">
                        <input type="text" value="${prize.text}" data-index="${index}" placeholder="Tên ô" class="prize-name flex-1 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white">
                        <input type="number" value="${prize.weight}" data-index="${index}" placeholder="Tỉ lệ" min="1" class="prize-weight w-16 bg-gray-800 border border-gray-700 rounded p-1.5 text-sm text-white text-center" title="Trọng số tỉ lệ">
                        <input type="color" value="${prize.color || '#f59e0b'}" data-index="${index}" class="prize-color w-8 h-8 rounded cursor-pointer bg-transparent">
                        <button onclick="removePrizeRow(${index})" class="text-red-400 hover:text-red-500 font-bold px-2 text-lg">×</button>
                    </div>
                `;
            });
        }

        function addPrizeRow() {
            prizes.push({ text: "Giải mới", weight: 10, color: "#14b8a6" });
            renderPrizeInputs();
        }

        function removePrizeRow(index) {
            if (prizes.length <= 2) {
                alert("Vòng quay phải có ít nhất 2 ô!");
                return;
            }
            prizes.splice(index, 1);
            renderPrizeInputs();
        }

        function savePrizes() {
            const nameInputs = document.querySelectorAll(".prize-name");
            const weightInputs = document.querySelectorAll(".prize-weight");
            const colorInputs = document.querySelectorAll(".prize-color");
            
            let newPrizes = [];
            for (let i = 0; i < nameInputs.length; i++) {
                newPrizes.push({
                    text: nameInputs[i].value || "Ô trống",
                    weight: Number(weightInputs[i].value) || 1,
                    color: colorInputs[i].value
                });
            }

            prizes = newPrizes;
            localStorage.setItem('wheel_prizes_weighted', JSON.stringify(prizes));
            drawWheel();
            closeModal('adminPanelModal');
            alert("Đã lưu cấu hình và tỉ lệ thành công!");
        }

        // Khởi chạy vẽ vòng quay lần đầu
        drawWheel();
    </script>
</body>
  </html>
