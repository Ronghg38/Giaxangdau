<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạc Trượt Nổ Hũ - Tốc Độ Chậm Chuẩn Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
        }
        .mahjong-tile {
            transition: all 0.3s ease;
            user-select: none;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.6); }
            50% { box-shadow: 0 0 25px rgba(234, 179, 8, 1); }
        }
        .win-glow {
            animation: pulse-glow 0.8s infinite;
            border-color: #eab308 !important;
            background-color: rgba(133, 77, 14, 0.4) !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-3">

    <!-- Khung Game Chính -->
    <div class="max-w-md w-full bg-slate-900 border-2 border-amber-500/50 rounded-2xl shadow-2xl p-4 relative">
        <h1 class="text-lg font-bold text-amber-400 text-center mb-1">🀄 MAHJONG WAYS - MẠC TRƯỢT 🀄</h1>

        <!-- Hệ số nhân x1, x2, x3, x5 giống hình -->
        <div class="flex justify-center space-x-2 mb-3 text-xs font-bold">
            <span class="bg-amber-500 text-slate-950 px-3 py-1 rounded-full shadow">x1</span>
            <span class="bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">x2</span>
            <span class="bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">x3</span>
            <span class="bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">x5</span>
        </div>

        <!-- Thông tin người chơi -->
        <div id="userSection" class="hidden bg-slate-800 p-2.5 rounded-xl mb-3 flex justify-between items-center border border-slate-700">
            <div>
                <p class="text-xs text-slate-400">Tài khoản: <span id="currentUsername" class="text-white font-bold"></span></p>
                <p class="text-sm text-amber-400 font-bold mt-0.5">Số dư: <span id="userBalance">0</span> điểm</p>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-2.5 py-1 rounded-lg text-white font-semibold">Đăng xuất</button>
        </div>

        <!-- Form Đăng nhập -->
        <div id="loginSection" class="mb-3">
            <h3 class="text-xs font-semibold text-slate-300 mb-2">Nhập tên tài khoản để chơi:</h3>
            <div class="flex space-x-2">
                <input type="text" id="loginUsername" placeholder="Tên tài khoản..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <button onclick="loginUser()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">Vào chơi</button>
            </div>
        </div>

        <!-- Màn hình Lưới Quân Bài (4 hàng x 5 cột = 20 ô chuẩn game) -->
        <div id="gameSection" class="hidden">
            <div class="bg-slate-950 border-2 border-amber-500/60 rounded-xl p-2.5 mb-3 tile-grid text-center" id="boardGrid">
                <!-- Sinh tự động bằng JS -->
            </div>

            <div id="gameMessage" class="text-xs text-center text-emerald-400 h-6 font-semibold mb-2">Nhấn nút quay để bắt đầu!</div>

            <!-- Nút Quay lớn ở giữa giống giao diện mẫu -->
            <div class="flex items-center justify-center space-x-3">
                <button id="spinBtn" onclick="playSlot()" class="flex-1 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-extrabold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2 border-2 border-amber-300">
                    <span>🔄 QUAY NGAY (-10đ)</span>
                </button>
            </div>
        </div>

        <!-- Khu vực Admin -->
        <div class="mt-4 border-t border-slate-800 pt-3 flex justify-between items-center">
            <span class="text-xs text-slate-500">Hệ thống quản trị</span>
            <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-xs text-amber-400 py-1.5 px-3 rounded-lg border border-slate-700 font-semibold">
                ⚙️ Cài Đặt Admin
            </button>
        </div>
    </div>

    <!-- Modal Đăng nhập Admin -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 rounded-xl p-6 max-w-xs w-full border border-slate-700">
            <h3 class="text-lg font-bold mb-3 text-amber-400">Mật khẩu Admin</h3>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white mb-4 focus:outline-none focus:border-amber-500 text-sm">
            <div class="flex space-x-2">
                <button onclick="checkAdminPassword()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg text-sm">Xác nhận</button>
                <button onclick="closeModal('adminLoginModal')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-sm">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Modal Bảng Quản Lý Admin -->
    <div id="adminPanelModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 rounded-xl p-6 max-w-md w-full border border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-amber-400">Bảng Điều Khiển Admin</h3>
                <button onclick="closeModal('adminPanelModal')" class="text-slate-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            
            <!-- Cài đặt tỉ lệ -->
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-4">
                <h4 class="text-sm font-bold text-amber-400 mb-2">📊 Cài Đặt Tỉ Lệ Thắng (%)</h4>
                <div class="flex items-center justify-between text-xs text-slate-300 mb-2">
                    <span>Tỉ lệ Nổ Hũ / Thắng lớn:</span>
                    <input type="number" id="winRateInput" min="0" max="100" class="w-16 bg-slate-800 border border-slate-700 rounded p-1 text-center text-amber-400 font-bold" value="25"> %
                </div>
                <button onclick="saveGameConfig()" class="w-full bg-amber-600 hover:bg-amber-700 text-slate-950 font-bold py-1.5 rounded text-xs">Lưu tỉ lệ</button>
            </div>

            <!-- Quản lý người chơi -->
            <p class="text-xs text-slate-400 mb-2">Quản lý tài khoản và cấp điểm:</p>
            <div id="userListContainer" class="space-y-3 mb-4">
                <!-- Danh sách tài khoản -->
            </div>

            <button onclick="closeModal('adminPanelModal')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg font-bold text-sm">Đóng</button>
        </div>
    </div>

    <script>
        const ADMIN_SECRET = "admin123456";
        let currentUser = localStorage.getItem('mahjong_slow_user') || null;
        let accounts = JSON.parse(localStorage.getItem('mahjong_slow_accounts')) || [];
        let winRate = Number(localStorage.getItem('mahjong_slow_rate')) || 25;

        const tiles = ["🀄", "🀇", "🀈", "🀉", "🀊", "🀋", "🀌", "🀍", "🀎", "🀏"];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'spin') {
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.6);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
            } else if (type === 'click') {
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        function initApp() {
            if (currentUser) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('userSection').classList.remove('hidden');
                document.getElementById('gameSection').classList.remove('hidden');
                document.getElementById('currentUsername').innerText = currentUser;
                updateBalanceDisplay();
                renderBoard(getRandomBoard());
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('userSection').classList.add('hidden');
                document.getElementById('gameSection').classList.add('hidden');
            }
        }

        function loginUser() {
            playSound('click');
            const username = document.getElementById('loginUsername').value.trim();
            if (!username) {
                alert("Vui lòng nhập tên tài khoản!");
                return;
            }

            let acc = accounts.find(a => a.username === username);
            if (!acc) {
                acc = { username: username, balance: 100 };
                accounts.push(acc);
                saveAccounts();
            }

            currentUser = username;
            localStorage.setItem('mahjong_slow_user', currentUser);
            document.getElementById('loginUsername').value = '';
            initApp();
        }

        function logout() {
            playSound('click');
            currentUser = null;
            localStorage.removeItem('mahjong_slow_user');
            initApp();
        }

        function getAccount(username) {
            return accounts.find(a => a.username === username);
        }

        function updateBalanceDisplay() {
            const acc = getAccount(currentUser);
            if (acc) {
                document.getElementById('userBalance').innerText = acc.balance;
            }
        }

        function saveAccounts() {
            localStorage.setItem('mahjong_slow_accounts', JSON.stringify(accounts));
        }

        function getRandomBoard(isWin = false) {
            let board = [];
            for (let i = 0; i < 20; i++) { // Lưới 4x5 = 20 ô
                board.push(tiles[Math.floor(Math.random() * tiles.length)]);
            }
            if (isWin) {
                let luckyTile = tiles[Math.floor(Math.random() * tiles.length)];
                // Tạo cụm trúng thưởng ở giữa lưới
                board[6] = luckyTile;
                board[7] = luckyTile;
                board[11] = luckyTile;
                board[12] = luckyTile;
            }
            return board;
        }

        function renderBoard(boardData, winningIndices = []) {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = "";
            boardData.forEach((tile, index) => {
                const isWinning = winningIndices.includes(index);
                grid.innerHTML += `
                    <div class="bg-slate-800 border ${isWinning ? 'win-glow' : 'border-slate-700'} rounded-lg py-3 mahjong-tile">
                        ${tile}
                    </div>
                `;
            });
        }

        function playSlot() {
            let acc = getAccount(currentUser);
            const betCost = 10;

            if (acc.balance < betCost) {
                alert("Số dư của bạn đã hết! Vui lòng liên hệ Admin để nạp thêm điểm.");
                return;
            }

            playSound('spin');
            acc.balance -= betCost;
            saveAccounts();
            updateBalanceDisplay();

            document.getElementById("spinBtn").disabled = true;
            document.getElementById("gameMessage.innerHTML") = "";

            // Tốc độ chậm, mượt từ từ giống video (thời gian chạy vòng lặp chậm hơn: 150ms)
            let step = 0;
            let maxSteps = 12; 
            let interval = setInterval(() => {
                renderBoard(getRandomBoard());
                step++;
                if (step >= maxSteps) {
                    clearInterval(interval);

                    let randomRoll = Math.random() * 100;
                    let isWin = randomRoll < winRate;
                    let finalBoard = getRandomBoard(isWin);

                    if (isWin) {
                        playSound('win');
                        let reward = 100;
                        acc.balance += reward;
                        renderBoard(finalBoard, [6, 7, 11, 12]);
                        document.getElementById("gameMessage").innerText = `🎉 NỔ HŨ THÀNH CÔNG! Trúng +${reward} điểm!`;
                    } else {
                        renderBoard(finalBoard);
                        document.getElementById("gameMessage").innerText = "❌ Trượt rồi, chúc bạn may mắn lần sau!";
                    }

                    saveAccounts();
                    updateBalanceDisplay();
                    document.getElementById("spinBtn").disabled = false;
                }
            }, 150); // Tốc độ trễ từng nhịp chậm rãi
        }

        // Admin Functions
        function openAdminModal() {
            playSound('click');
            document.getElementById("adminLoginModal").classList.remove("hidden");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
        }

        function checkAdminPassword() {
            const pass = document.getElementById("adminPassword").value;
            if (pass === ADMIN_SECRET) {
                closeModal('adminLoginModal');
                document.getElementById("adminPassword").value = "";
                document.getElementById("winRateInput").value = winRate;
                renderAdminUserList();
                document.getElementById("adminPanelModal").classList.remove("hidden");
            } else {
                alert("Mật khẩu Admin không đúng!");
            }
        }

        function saveGameConfig() {
            let newRate = Number(document.getElementById("winRateInput").value);
            if (isNaN(newRate) || newRate < 0 || newRate > 100) {
                alert("Vui lòng nhập tỉ lệ từ 0 đến 100!");
                return;
            }
            winRate = newRate;
            localStorage.setItem('mahjong_slow_rate', winRate);
            alert("Đã cập nhật tỉ lệ thành công!");
        }

        function renderAdminUserList() {
            const container = document.getElementById("userListContainer");
            container.innerHTML = "";

            if (accounts.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center">Chưa có người chơi nào đăng nhập.</p>`;
                return;
            }

            accounts.forEach((acc, index) => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                        <div>
                            <p class="text-sm font-bold text-white">${acc.username}</p>
                            <p class="text-xs text-amber-400">Số dư: ${acc.balance} điểm</p>
                        </div>
                        <div class="flex space-x-1.5">
                            <button onclick="adminAddBalance(${index}, 50)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2 py-1 rounded font-bold">+50đ</button>
                            <button onclick="adminAddBalance(${index}, 200)" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded font-bold">+200đ</button>
                        </div>
                    </div>
                `;
            });
        }

        function adminAddBalance(index, amount) {
            accounts[index].balance += amount;
            saveAccounts();
            renderAdminUserList();
            if (currentUser === accounts[index].username) {
                updateBalanceDisplay();
            }
        }

        initApp();
    </script>
</body>
</html>
