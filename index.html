<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạc Trượt Nổ Hũ - Admin Quản Lý Tỉ Lệ & Điểm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .mahjong-tile {
            transition: all 0.2s ease;
        }
        .mahjong-tile:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Khung Game Chính -->
    <div class="max-w-md w-full bg-slate-900 border border-amber-500/40 rounded-2xl shadow-2xl p-5 relative">
        <h1 class="text-xl font-bold text-amber-400 text-center mb-3">🀄 MẠC TRƯỢT NỔ HŨ 🀄</h1>

        <!-- Thông tin người chơi -->
        <div id="userSection" class="hidden bg-slate-800 p-3 rounded-xl mb-4 flex justify-between items-center border border-slate-700">
            <div>
                <p class="text-xs text-slate-400">Tài khoản: <span id="currentUsername" class="text-white font-bold"></span></p>
                <p class="text-sm text-amber-400 font-bold mt-0.5">Số dư: <span id="userBalance">0</span> điểm</p>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded-lg text-white font-semibold">Đăng xuất</button>
        </div>

        <!-- Form Đăng nhập -->
        <div id="loginSection" class="mb-4">
            <h3 class="text-sm font-semibold text-slate-300 mb-2">Nhập tên để tham gia trò chơi</h3>
            <div class="flex space-x-2">
                <input type="text" id="loginUsername" placeholder="Tên tài khoản..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <button onclick="loginUser()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">Vào chơi</button>
            </div>
        </div>

        <!-- Màn hình chơi -->
        <div id="gameSection" class="hidden">
            <div class="bg-slate-950 border-2 border-amber-500/50 rounded-xl p-4 mb-4 grid grid-cols-3 gap-3 text-center">
                <div class="bg-slate-800 border border-slate-700 rounded-lg py-4 text-4xl mahjong-tile" id="slot1">🀄</div>
                <div class="bg-slate-800 border border-slate-700 rounded-lg py-4 text-4xl mahjong-tile" id="slot2">🀇</div>
                <div class="bg-slate-800 border border-slate-700 rounded-lg py-4 text-4xl mahjong-tile" id="slot3">🀏</div>
            </div>

            <div id="gameMessage" class="text-sm text-center text-emerald-400 h-6 font-semibold mb-3">Nhấn nút quay để bắt đầu!</div>

            <button id="spinBtn" onclick="playSlot()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-bold py-3 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                QUAY NGAY (-10 điểm)
            </button>
        </div>

        <!-- Khu vực Admin -->
        <div class="mt-6 border-t border-slate-800 pt-3 flex justify-between items-center">
            <span class="text-xs text-slate-500">Quản trị viên hệ thống</span>
            <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-xs text-amber-400 py-1.5 px-3 rounded-lg border border-slate-700 font-semibold">
                ⚙️ Cài Đặt Admin
            </button>
        </div>
    </div>

    <!-- Modal Đăng nhập Admin -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 rounded-xl p-6 max-w-xs w-full border border-slate-700">
            <h3 class="text-lg font-bold mb-3 text-amber-400">Mật khẩu Admin</h3>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white mb-4 focus:outline-none focus:border-amber-500 text-sm">
            <div class="flex space-x-2">
                <button onclick="checkAdminPassword()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg text-sm">Xác nhận</button>
                <button onclick="closeModal('adminLoginModal')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-sm">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Modal Bảng Quản Lý Admin (Cấp điểm & Chỉnh tỉ lệ) -->
    <div id="adminPanelModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 rounded-xl p-6 max-w-md w-full border border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-amber-400">Bảng Điều Khiển Admin</h3>
                <button onclick="closeModal('adminPanelModal')" class="text-slate-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            
            <!-- Phần cài đặt tỉ lệ -->
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-4">
                <h4 class="text-sm font-bold text-amber-400 mb-2">📊 Cài Đặt Tỉ Lệ Thắng/Thua</h4>
                <div class="flex items-center justify-between text-xs text-slate-300 mb-2">
                    <span>Tỉ lệ Nổ Hũ lớn (3 hình giống nhau):</span>
                    <input type="number" id="winRateInput" min="0" max="100" class="w-16 bg-slate-800 border border-slate-700 rounded p-1 text-center text-amber-400 font-bold" value="20"> %
                </div>
                <button onclick="saveGameConfig()" class="w-full bg-amber-600 hover:bg-amber-700 text-slate-950 font-bold py-1.5 rounded text-xs">Lưu tỉ lệ</button>
            </div>

            <!-- Phần quản lý người chơi -->
            <p class="text-xs text-slate-400 mb-2">Quản lý tài khoản và cấp điểm:</p>
            <div id="userListContainer" class="space-y-3 mb-4">
                <!-- Danh sách tài khoản hiển thị ở đây -->
            </div>

            <button onclick="closeModal('adminPanelModal')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg font-bold text-sm">Đóng</button>
        </div>
    </div>

    <script>
        const ADMIN_SECRET = "admin123456"; // Mật khẩu admin của bạn
        let currentUser = localStorage.getItem('mahjong_current_user') || null;
        let accounts = JSON.parse(localStorage.getItem('mahjong_accounts')) || [];
        
        // Tỉ lệ nổ hũ mặc định (ví dụ: 20%)
        let winRate = Number(localStorage.getItem('mahjong_win_rate')) || 20;

        const tiles = ["🀄", "🀇", "🀈", "🀉", "🀊", "🀋", "🀌", "🀍", "🀎", "🀏"];

        function initApp() {
            if (currentUser) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('userSection').classList.remove('hidden');
                document.getElementById('gameSection').classList.remove('hidden');
                document.getElementById('currentUsername').innerText = currentUser;
                updateBalanceDisplay();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('userSection').classList.add('hidden');
                document.getElementById('gameSection').classList.add('hidden');
            }
        }

        function loginUser() {
            const username = document.getElementById('loginUsername').value.trim();
            if (!username) {
                alert("Vui lòng nhập tên tài khoản!");
                return;
            }

            let acc = accounts.find(a => a.username === username);
            if (!acc) {
                acc = { username: username, balance: 100 };
                accounts.push(acc);
                saveAccounts();
            }

            currentUser = username;
            localStorage.setItem('mahjong_current_user', currentUser);
            document.getElementById('loginUsername').value = '';
            initApp();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('mahjong_current_user');
            initApp();
        }

        function getAccount(username) {
            return accounts.find(a => a.username === username);
        }

        function updateBalanceDisplay() {
            const acc = getAccount(currentUser);
            if (acc) {
                document.getElementById('userBalance').innerText = acc.balance;
            }
        }

        function saveAccounts() {
            localStorage.setItem('mahjong_accounts', JSON.stringify(accounts));
        }

        function playSlot() {
            let acc = getAccount(currentUser);
            const betCost = 10;

            if (acc.balance < betCost) {
                alert("Số dư của bạn đã hết! Vui lòng liên hệ Admin để nạp thêm điểm.");
                return;
            }

            acc.balance -= betCost;
            saveAccounts();
            updateBalanceDisplay();

            document.getElementById("gameMessage").innerText = "Đang quay...";
            document.getElementById("slot1").innerText = "🔄";
            document.getElementById("slot2").innerText = "🔄";
            document.getElementById("slot3").innerText = "🔄";

            setTimeout(() => {
                let randomRoll = Math.random() * 100; // Quay số từ 0 đến 100
                let t1, t2, t3;

                // Nếu số quay nhỏ hơn tỉ lệ winRate cài đặt -> Cho trúng hũ lớn
                if (randomRoll < winRate) {
                    let winningTile = tiles[Math.floor(Math.random() * tiles.length)];
                    t1 = winningTile;
                    t2 = winningTile;
                    t3 = winningTile;
                } else {
                    // Ngược lại ra kết quả trượt hoặc trúng nhỏ
                    t1 = tiles[Math.floor(Math.random() * tiles.length)];
                    t2 = tiles[Math.floor(Math.random() * tiles.length)];
                    t3 = tiles[Math.floor(Math.random() * tiles.length)];
                    while(t1 === t2 && t2 === t3) { // Tránh trùng tình cờ
                        t3 = tiles[Math.floor(Math.random() * tiles.length)];
                    }
                }

                document.getElementById("slot1").innerText = t1;
                document.getElementById("slot2").innerText = t2;
                document.getElementById("slot3").innerText = t3;

                if (t1 === t2 && t2 === t3) {
                    const reward = 100;
                    acc.balance += reward;
                    document.getElementById("gameMessage").innerText = `🎉 NỔ HŨ THÀNH CÔNG! Trúng +${reward} điểm!`;
                } else if (t1 === t2 || t2 === t3 || t1 === t3) {
                    const reward = 20;
                    acc.balance += reward;
                    document.getElementById("gameMessage").innerText = `✨ Thắng nhỏ! Nhận +${reward} điểm!`;
                } else {
                    document.getElementById("gameMessage").innerText = "❌ Trượt rồi, chúc bạn may mắn lần sau!";
                }

                saveAccounts();
                updateBalanceDisplay();
            }, 600);
        }

        // Admin Functions
        function openAdminModal() {
            document.getElementById("adminLoginModal").classList.remove("hidden");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
        }

        function checkAdminPassword() {
            const pass = document.getElementById("adminPassword").value;
            if (pass === ADMIN_SECRET) {
                closeModal('adminLoginModal');
                document.getElementById("adminPassword").value = "";
                document.getElementById("winRateInput").value = winRate;
                renderAdminUserList();
                document.getElementById("adminPanelModal").classList.remove("hidden");
            } else {
                alert("Mật khẩu Admin không đúng!");
            }
        }

        function saveGameConfig() {
            let newRate = Number(document.getElementById("winRateInput").value);
            if (isNaN(newRate) || newRate < 0 || newRate > 100) {
                alert("Vui lòng nhập tỉ lệ từ 0 đến 100!");
                return;
            }
            winRate = newRate;
            localStorage.setItem('mahjong_win_rate', winRate);
            alert("Đã cập nhật tỉ lệ thắng thành công!");
        }

    function renderAdminUserList() {
        const container = document.getElementById("userListContainer");
        container.innerHTML = "";

        if (accounts.length === 0) {
            container.innerHTML = `<p class="text-xs text-slate-500 text-center">Chưa có người chơi nào đăng nhập.</p>`;
            return;
        }

        accounts.forEach((acc, index) => {
            container.innerHTML += `
                <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                    <div>
                        <p class="text-sm font-bold text-white">${acc.username}</p>
                        <p class="text-xs text-amber-400">Số dư: ${acc.balance} điểm</p>
                    </div>
                    <div class="flex space-x-1.5">
                        <button onclick="adminAddBalance(${index}, 50)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2 py-1 rounded font-bold">+50đ</button>
                        <button onclick="adminAddBalance(${index}, 200)" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded font-bold">+200đ</button>
                    </div>
                </div>
            `;
        });
    }

    function adminAddBalance(index, amount) {
        accounts[index].balance += amount;
        saveAccounts();
        renderAdminUserList();
        if (currentUser === accounts[index].username) {
            updateBalanceDisplay();
        }
    }

    initApp();
</script>
</body>
</html>
