    - name: Commit and push changes if price updated
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add oil_prices.db prices.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices database and json" && git push)
        
